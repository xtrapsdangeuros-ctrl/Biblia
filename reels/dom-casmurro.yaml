codigo: P30                  # código da capa na pasta "Capas Novas" do Drive
livro: Dom Casmurro
autor: Machado de Assis
texto: >-
  Ela traiu, ou não traiu? Faz mais de cem anos que o Brasil discute essa pergunta, e ninguém conseguiu responder.
  Bento Santiago, já velho e sozinho, resolve contar a própria vida. O amor de infância por Capitu, a vizinha de
  "olhos de ressaca". A promessa da mãe de fazer dele um padre. O seminário, o casamento, o melhor amigo, Escobar.
  E então chega a desconfiança. Um olhar demorado num velório. Um filho que, a cada ano, parece mais com o amigo
  do que com o pai.
  Só que tem um detalhe: a gente só escuta um lado. Quem conta a história é o marido ciumento. Será que Bentinho
  está dizendo a verdade... ou só a verdade dele?
  Dom Casmurro, de Machado de Assis. Ouça o audiolivro completo no canal Audiolivros Pavão, no YouTube. Link na bio.
