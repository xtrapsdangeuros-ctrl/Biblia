codigo: P27
livro: O Rei do Inverno
autor: Bernard Cornwell
texto: >-
  Esqueça a espada na pedra. Esqueça os cavaleiros de armadura brilhante. E se o rei Artur nunca tivesse sido rei?
  Britânia, perto do ano quinhentos. Os romanos foram embora, os saxões avançam, e o grande rei morre deixando no
  trono um bebê. Para proteger essa criança aparece um guerreiro filho bastardo do rei, chamado Artur, que sonha
  com paz entre reinos que só sabem guerrear.
  Quem conta tudo é Derfel, um menino que sobreviveu a um poço da morte, virou lanceiro de Artur e, já velho,
  escreve essas memórias escondido num mosteiro.
  Tem Merlin, druidas, juramentos sagrados... e uma única escolha feita por amor, que pode colocar tudo a perder.
  O Rei do Inverno, de Bernard Cornwell, o primeiro livro das Crônicas de Artur. Ouça o audiolivro completo no canal
  Audiolivros Pavão, no YouTube. Link na bio.
